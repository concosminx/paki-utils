[versions]
junit = "6.1.3"
junit_platform = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
release_plugin = "3.1.0"

[libraries]
junit = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit_platform" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

[plugins]
release = { id = "net.researchgate.release", version.ref = "release_plugin" }

[bundles]
testcontainers_junit = ["testcontainers", "testcontainers-junit"]
